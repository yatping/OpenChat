<!doctype html>
<!-- A plain host page on a different origin from the Worker, so that CORS and Origin checks run for real. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Widget test page</title>
  </head>
  <body>
    <h1>Example customer website</h1>
    <!-- The real, built scripts, because the loader finds its bundle from its own URL. Run pnpm --filter @openchat/widget build first. -->
    <script>
      window.OpenChatConfig = { websiteKey: 'site_dev', apiUrl: 'http://localhost:8787' };
    </script>
    <script src="/dist/widget.js" async></script>
  </body>
</html>
